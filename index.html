<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Lista di Casa</title>
<style>
  :root {
    --blue-deep: #2C4A6E;
    --blue-mid: #4C7CA6;
    --blue-pale: #E7F0F7;
    --bg: #F5F7F9;
    --text: #24313D;
    --text-muted: #7C8B98;
    --border: #D8E2E9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
  }
  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: white;
  }
  header {
    background: var(--blue-deep);
    color: white;
    padding: 1.2rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 20px;
    margin: 0;
    font-weight: normal;
  }
  main { padding: 1.25rem; }
  .setup, .status {
    background: var(--blue-pale);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    font-size: 14px;
  }
  .setup input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 10px;
  }
  button {
    background: var(--blue-mid);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--blue-mid);
    border: 1px solid var(--blue-mid);
  }
  .list-title {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 19px;
    margin: 0 0 12px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--blue-pale);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .item.done {
    background: #F0F0F0;
    opacity: 0.7;
  }
  .item span {
    flex: 1;
    font-size: 14px;
  }
  .item.done span {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .item input[type="checkbox"] {
    width: 18px;
    height: 18px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 1rem;
  }
  .add-row input {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .error {
    color: #B3312C;
    font-size: 13px;
    margin-top: 8px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>La Lista di Casa</h1>
  </header>
  <main>

    <div class="setup" id="setup-box">
      <div id="setup-text">
        Per collegarti a Home Assistant serve il token di accesso a lunga durata.
      </div>
      <input type="password" id="token-input" placeholder="Incolla qui il token">
      <button onclick="salvaToken()">Connetti</button>
      <div class="error hidden" id="setup-error"></div>
    </div>

    <div class="status hidden" id="status-box">Connessione in corso...</div>

    <div id="content" class="hidden">
      <p class="list-title">Vivaio</p>
      <div id="items-container"></div>
      <div class="add-row">
        <input type="text" id="new-item-input" placeholder="Aggiungi un prodotto" onkeypress="if(event.key==='Enter') aggiungiArticolo()">
        <button onclick="aggiungiArticolo()">+</button>
      </div>
      <p style="margin-top:1.5rem;">
        <button class="secondary" onclick="scollega()">Scollega token salvato</button>
      </p>
    </div>

  </main>
</div>

<script>
const HA_URL = "tepktbbit8utngvxc3enhyzgigkwehzm.ui.nabu.casa";
const ENTITY_ID = "todo.mainaluca_libero_it_vivaio";

let ws = null;
let msgId = 1;
const pending = {};

function getToken() {
  return localStorage.getItem("ha_token");
}

function salvaToken() {
  const val = document.getElementById("token-input").value.trim();
  if (!val) {
    mostraErroreSetup("Incolla il token prima di continuare.");
    return;
  }
  localStorage.setItem("ha_token", val);
  connetti();
}

function scollega() {
  localStorage.removeItem("ha_token");
  location.reload();
}

function mostraErroreSetup(msg) {
  const el = document.getElementById("setup-error");
  el.textContent = msg;
  el.classList.remove("hidden");
}

function mostraStato(msg) {
  const box = document.getElementById("status-box");
  box.textContent = msg;
  box.classList.remove("hidden");
}

function nascondiStato() {
  document.getElementById("status-box").classList.add("hidden");
}

function connetti() {
  const token = getToken();
  if (!token) return;

  document.getElementById("setup-box").classList.add("hidden");
  mostraStato("Connessione in corso...");

  ws = new WebSocket("wss://" + HA_URL + "/api/websocket");

  ws.onopen = () => {};

  ws.onerror = () => {
    mostraStato("");
    mostraErroreSetupEriapri("Errore di connessione. Controlla l'indirizzo Nabu Casa e la connessione internet.");
  };

  ws.onclose = () => {
    mostraStato("Connessione chiusa. Ricarica la pagina per riprovare.");
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "auth_required") {
      ws.send(JSON.stringify({ type: "auth", access_token: token }));
      return;
    }

    if (msg.type === "auth_invalid") {
      mostraStato("");
      localStorage.removeItem("ha_token");
      document.getElementById("setup-box").classList.remove("hidden");
      mostraErroreSetup("Token non valido o scaduto. Incollane uno nuovo.");
      return;
    }

    if (msg.type === "auth_ok") {
      nascondiStato();
      document.getElementById("content").classList.remove("hidden");
      caricaArticoli();
      sottoscriviAggiornamenti();
      return;
    }

    if (msg.type === "result" && pending[msg.id]) {
      if (msg.success) {
        pending[msg.id].resolve(msg.result);
      } else {
        pending[msg.id].reject(msg.error);
      }
      delete pending[msg.id];
      return;
    }

    if (msg.type === "event") {
      const entityChanged = msg.event && msg.event.data && msg.event.data.entity_id === ENTITY_ID;
      if (entityChanged) {
        caricaArticoli();
      }
    }
  };
}

function mostraErroreSetupEriapri(msg) {
  document.getElementById("setup-box").classList.remove("hidden");
  mostraErroreSetup(msg);
}

function inviaComando(payload) {
  return new Promise((resolve, reject) => {
    const id = msgId++;
    pending[id] = { resolve, reject };
    ws.send(JSON.stringify({ id, ...payload }));
  });
}

function sottoscriviAggiornamenti() {
  inviaComando({ type: "subscribe_events", event_type: "state_changed" }).catch(() => {});
}

function caricaArticoli() {
  inviaComando({ type: "todo/item/list", entity_id: ENTITY_ID })
    .then((result) => {
      disegnaArticoli(result.items || []);
    })
    .catch(() => {
      mostraStato("Errore nel caricare la lista.");
    });
}

function disegnaArticoli(items) {
  const container = document.getElementById("items-container");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Nessun articolo in lista.</p>';
    return;
  }

  const daFare = items.filter(i => i.status !== "completed");
  const fatti = items.filter(i => i.status === "completed");

  daFare.forEach(item => container.appendChild(creaRigaArticolo(item)));

  if (fatti.length > 0) {
    const sep = document.createElement("p");
    sep.style.cssText = "font-size:12px; color:var(--text-muted); margin: 14px 0 6px;";
    sep.textContent = "Comprato (" + fatti.length + ")";
    container.appendChild(sep);
    fatti.forEach(item => container.appendChild(creaRigaArticolo(item)));
  }
}

function creaRigaArticolo(item) {
  const row = document.createElement("div");
  row.className = "item" + (item.status === "completed" ? " done" : "");

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = item.status === "completed";
  checkbox.onchange = () => cambiaStato(item, checkbox.checked);

  const label = document.createElement("span");
  label.textContent = item.summary;

  row.appendChild(checkbox);
  row.appendChild(label);
  return row;
}

function cambiaStato(item, completato) {
  inviaComando({
    type: "call_service",
    domain: "todo",
    service: "update_item",
    service_data: {
      item: item.uid,
      status: completato ? "completed" : "needs_action"
    },
    target: { entity_id: ENTITY_ID }
  }).then(() => caricaArticoli());
}

function aggiungiArticolo() {
  const input = document.getElementById("new-item-input");
  const testo = input.value.trim();
  if (!testo) return;

  inviaComando({
    type: "call_service",
    domain: "todo",
    service: "add_item",
    service_data: { item: testo },
    target: { entity_id: ENTITY_ID }
  }).then(() => {
    input.value = "";
    caricaArticoli();
  });
}

window.onload = () => {
  if (getToken()) {
    connetti();
  }
};
</script>
</body>
</html>
