name: Browser prices

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request ID
        required: true
        type: string
      items_json:
        description: JSON lista prodotti
        required: true
        type: string
      prefs_json:
        description: JSON preferenze
        required: false
        default: "[]"
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install browser worker
        working-directory: scraper
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Navigate shops and flyers
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          ITEMS_JSON: ${{ inputs.items_json }}
          PREFS_JSON: ${{ inputs.prefs_json }}
          OUTPUT_FILE: data/price-results/${{ inputs.request_id }}.json
        run: node scraper/scrape-prices.mjs
      - name: Save result
        run: |
          git config user.name "lista-spesa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/price-results/
          git commit -m "Prezzi browser ${{ inputs.request_id }}" || exit 0
          git push
